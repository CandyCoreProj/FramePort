<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com">
  <title>FramePort — Simple</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Urbanist:wght@700&display=swap" rel="stylesheet">
  <style>
    /* คลิปเปิดตัวโปรแกรม 1920×1080 แนว product launch แบบนุ่มนวล (light mode): พื้นไล่สีพาสเทล + การ์ดกระจกฝ้า
       + ระยะชัดตื้น (ชิ้นที่อยู่ไกลเบลอ) + ข้อความค่อยๆ ลอยขึ้นทีละคำ + เปลี่ยนฉากด้วยการเลื่อนโฟกัส (เบลอออก → ชัดเข้า) + กล้องเคลื่อนช้าตลอด */
    :root {
      --bg: #faf6f1; --ink: #1c1917; --muted: #6f665e; --rust: #a8441a; --apricot: #f2a054;
      --grad: linear-gradient(100deg, #f2a054 0%, #e2703c 55%, #a8441a 100%);
      --display: "IBM Plex Sans Thai", "IBM Plex Sans", "Leelawadee UI", "Segoe UI", sans-serif;
      --brand: "Urbanist", "IBM Plex Sans", sans-serif; /* ใช้เฉพาะโลโก้ตัวอักษร FramePort / CandyCore */
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
    #stage {
      position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; overflow: hidden;
      background: var(--bg); color: var(--ink); font-family: var(--display); -webkit-font-smoothing: antialiased;
      transform: translate(-50%, -50%) scale(var(--fit, 1));
    }
    .scene { position: absolute; inset: 0; transform-origin: 50% 50%; }
    /* พื้นไล่สีพาสเทล: ก้อนแสงสี่สีลอยช้าๆ */
    .glow { position: absolute; left: 0; top: 0; border-radius: 50%; }
    #glowA { width: 1500px; height: 1500px; background: radial-gradient(circle, rgb(255 211 168 / 75%) 0%, rgb(255 211 168 / 25%) 40%, transparent 70%); }
    #glowB { width: 1300px; height: 1300px; background: radial-gradient(circle, rgb(247 190 170 / 45%) 0%, rgb(247 190 170 / 14%) 40%, transparent 70%); }
    #glowC { width: 1400px; height: 1400px; background: radial-gradient(circle, rgb(222 214 240 / 55%) 0%, rgb(222 214 240 / 16%) 42%, transparent 70%); }
    #glowD { width: 1200px; height: 1200px; background: radial-gradient(circle, rgb(255 255 255 / 95%) 0%, rgb(255 255 255 / 40%) 42%, transparent 70%); }
    .float { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

    /* กระจกฝ้า */
    .glass { border-radius: 28px; background: linear-gradient(150deg, rgb(255 255 255 / 78%), rgb(255 255 255 / 46%));
      box-shadow: inset 0 1.5px 0 rgb(255 255 255 / 95%), inset 0 0 0 1.5px rgb(255 255 255 / 70%), 0 34px 70px -34px rgb(150 80 30 / 30%), 0 10px 24px -14px rgb(28 25 23 / 10%); }
    .tile { padding: 16px 18px; }
    .tile .label { margin-bottom: 8px; }
    .tile .seg.out, .tile .seg3 { grid-template-columns: repeat(3, 150px); }

    /* ข้อความที่ค่อยๆ ขึ้นทีละคำ */
    .typed { position: absolute; white-space: nowrap; }
    .typed .w { padding: .12em .02em .16em; }
    .hot { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; padding: .1em 0 .14em; }
    .w { display: inline-block; }
    .center { left: 0; right: 0; text-align: center; }
    .t-hero { font: 500 76px/1.3 var(--display); }
    .t-head { font: 600 84px/1.3 var(--display); }
    .t-col { font: 400 92px/1.28 var(--display); }
    .t-col.bold { font-weight: 700; }
    .eyebrow { position: absolute; font: 600 32px/1.3 var(--display); color: var(--rust); white-space: nowrap; }
    .subline { position: absolute; left: 0; right: 0; text-align: center; font: 500 36px/1.4 var(--display); color: var(--muted); white-space: nowrap; }

    /* การ์ดโลโก้ */
    #logoCard { width: 760px; height: 470px; display: grid; justify-items: center; align-content: center; gap: 22px; border-radius: 56px; }
    #logoCard .app-icon { width: 170px; height: 170px; }
    .app-icon .icon { display: block; width: 100%; height: 100%; }
    .app-icon { filter: drop-shadow(0 22px 34px rgb(120 60 20 / 28%)); }
    .wordmark { font: 700 118px/1.05 var(--brand); letter-spacing: -.045em; white-space: nowrap; }

    /* แผงความคืบหน้าขนาดใหญ่ */
    #bigProg { width: 1360px; padding: 44px 52px 40px; border-radius: 44px; }
    #bigProg .ph { font: 700 40px/1.3 var(--display); white-space: nowrap; }
    #bigProg .track { height: 18px; margin: 26px 0 18px; overflow: hidden; border-radius: 99px; background: rgb(28 25 23 / 9%); }
    #bigProg .fill { height: 100%; border-radius: inherit; background: var(--grad); transform-origin: left; }
    #bigProg .st { display: flex; justify-content: space-between; font: 500 30px/1.3 var(--display); color: var(--muted); font-variant-numeric: tabular-nums; }
    #bigProg .st b { color: var(--ink); font-weight: 700; }
    .pill { display: inline-flex; align-items: center; gap: 12px; padding: 16px 28px; border-radius: 999px; font: 600 30px/1 "IBM Plex Sans", var(--display); white-space: nowrap; }
    .pill i { width: 12px; height: 12px; border-radius: 50%; background: var(--grad); }
    #bigResult { display: flex; align-items: center; gap: 24px; width: 1360px; padding: 26px 34px; border-radius: 34px; }
    #bigResult svg { width: 52px; height: 52px; flex: none; color: #2f7d4f; }
    #bigResult b { display: block; font: 700 34px/1.3 var(--display); }
    #bigResult small { display: block; font: 500 26px/1.3 var(--display); color: var(--muted); }
    #bigResult .btn2 { margin-left: auto; padding: 14px 24px; border-radius: 999px; background: rgb(28 25 23 / 6%); font: 600 26px/1 var(--display); }

    /* การ์ดไฟล์ลอยรอบข้อความ */
    .fcard { display: flex; align-items: center; gap: 22px; padding: 22px 30px 22px 22px; border-radius: 32px; white-space: nowrap; }
    .fcard b { display: block; font: 700 32px/1.25 "IBM Plex Sans", var(--display); }
    .fcard small { display: block; margin-top: 4px; font: 500 24px/1.3 var(--display); color: var(--muted); }
    .thumb { width: 96px; height: 96px; flex: none; display: grid; place-items: center; border-radius: 24px; }
    .thumb svg { width: 42px; height: 42px; }
    .thumb.video { background: linear-gradient(135deg, #f2a054, #a8441a); }
    .thumb.audio { background: linear-gradient(135deg, #ffd9ad, #e2703c); }
    .thumb.list { background: linear-gradient(135deg, #3a302a, #1c1917); }

    /* หน้าต่างโปรแกรม (Windows 11 + Mica) */
    .win { position: absolute; left: 0; top: 0; width: 940px; overflow: hidden; border-radius: 12px; transform-origin: 0 0;
      background: rgb(244 239 233 / 97%); color: #1c1917; box-shadow: 0 0 0 1px rgb(28 25 23 / 8%), 0 60px 120px -40px rgb(110 60 25 / 40%), 0 18px 36px -20px rgb(28 25 23 / 18%); }
    .win.dark { background: rgb(28 25 23 / 98%); color: #f4efe9; box-shadow: 0 0 0 1px rgb(255 255 255 / 8%), 0 60px 120px -40px rgb(40 20 10 / 60%); }
    .titlebar { height: 34px; display: flex; align-items: center; gap: 10px; padding-left: 14px; font: 12px/1 "Segoe UI Variable Text", "Segoe UI", sans-serif; }
    .titlebar .icon { display: block; width: 16px; height: 16px; }
    .ctl { display: flex; margin-left: auto; }
    .ctl i { width: 46px; height: 34px; display: grid; place-items: center; }
    .ctl svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1; }
    .app { padding: 6px 22px 16px; }
    /* ผืนหน้าต่างอยู่ครึ่งล่าง ขอบบนจางหาย ข้อความด้านบนจึงอยู่บนพื้นเรียบ อ่านง่าย */
    #gridWrap { position: absolute; inset: 0; perspective: 2600px; perspective-origin: 960px 600px;
      -webkit-mask-image: linear-gradient(to bottom, transparent 250px, #000 470px); mask-image: linear-gradient(to bottom, transparent 250px, #000 470px); }
    #plane { position: absolute; left: 0; top: 0; width: 2360px; height: 700px; transform-origin: 50% 50%; }
    .gcard { position: absolute; width: 560px; height: 330px; overflow: hidden; border-radius: 34px; padding: 30px 30px 0; }
    .gcard > .ui { zoom: 1.35; }
    .gcard .glabel { margin-bottom: 8px; color: var(--muted); font-size: 11px; font-weight: 700; }

    /* ปิดท้าย */
    #endIcon { position: absolute; left: 0; top: 0; width: 190px; height: 190px; }
    .kline { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; }
    .kline .w { padding: .12em .03em .16em; }
    .kline .sep { color: #d9b89c; }
    .lead { font: 500 40px/1.4 var(--display); color: var(--muted); }
    .notes { font: 500 32px/1.4 var(--display); color: var(--muted); }
    .url { font: 600 34px/1.4 var(--display); color: var(--rust); }
    .by { display: flex; align-items: center; justify-content: center; gap: 16px; font: 500 28px/1 var(--display); color: var(--muted); }
    .by .lbl { display: inline-block; }
    .by .chip { display: inline-flex; align-items: center; gap: 14px; padding: 9px 28px 9px 20px; border-radius: 999px; background: var(--ink);
      color: #fff; font: 700 30px/1 var(--brand); letter-spacing: -.02em; box-shadow: 0 14px 30px -14px rgb(28 25 23 / 45%); }
    .by .chip svg { width: 36px; height: 44px; flex: none; }
    .icon-glow { position: absolute; left: 0; top: 0; width: 760px; height: 760px; border-radius: 50%;
      background: radial-gradient(circle, rgb(255 217 173 / 80%) 0%, rgb(242 160 84 / 18%) 38%, transparent 68%); }

    #pointer { position: absolute; left: 0; top: 0; width: 30px; height: 46px; overflow: visible; transform-origin: 0 0; filter: drop-shadow(0 4px 6px rgb(28 25 23 / 35%)); }
    #clickRing { position: absolute; left: 0; top: 0; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 3px solid var(--rust); }
    #fade { position: absolute; inset: 0; background: var(--bg); pointer-events: none; }

    /* ---------- สำเนาหน้าตาโปรแกรมจริงจาก index.html (ธีมสว่าง) ---------- */
    .ui {
      --page: #f4efe9; --surface: #fff; --field: #eae2d8; --line: #e0d6ca; --field-line: #e0d6ca; --ink: #1c1917; --muted: #5c554f;
      --accent: #a8441a; --accent-soft: #ede3d6; --action: #f2a054; --on-action: #2a1405; --ok: #2f7d4f; --error: #b3261e;
      color: var(--ink); font: 14px/1.45 "IBM Plex Sans Thai", "IBM Plex Sans", "Leelawadee UI", "Segoe UI", sans-serif; letter-spacing: 0;
    }
    .ui .topbar { min-height: 45px; display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding: 0 2px 9px; border-bottom: 1px solid var(--line); }
    .ui .logo { width: 38px; height: 38px; flex: none; overflow: hidden; border-radius: 12px; box-shadow: 0 3px 8px rgb(28 25 23 / 12%); }
    .ui .logo .icon { display: block; width: 100%; height: 100%; }
    .ui h1 { margin: 0; font-size: 16px; line-height: 1.2; letter-spacing: -.01em; }
    .ui .sub { display: flex; align-items: center; gap: 7px; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .ui .okdot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--ok); }
    .ui .spacer { flex: 1; }
    .ui .hc { display: flex; gap: 6px; }
    .ui .btn { min-height: 32px; display: inline-flex; align-items: center; padding: 4px 9px; border: 1px solid var(--field-line); border-radius: 999px; background: var(--surface); font-size: 12px; white-space: nowrap; }
    .ui .btn.accent { color: var(--accent); }
    .ui .panel { display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); box-shadow: 0 8px 24px rgb(28 25 23 / 7%); }
    .ui .kicker { display: flex; align-items: center; gap: 7px; margin-bottom: -6px; color: var(--accent); font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .ui .kicker::before { width: 14px; height: 2px; content: ""; border-radius: 2px; background: var(--action); }
    .ui .headline { font-size: 18px; line-height: 1.2; font-weight: 750; letter-spacing: -.02em; }
    .ui .label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .ui .url-label { margin-bottom: -5px; }
    .ui .url-row { display: flex; gap: 7px; align-items: stretch; }
    .ui .input { min-width: 0; height: 40px; flex: 1; display: flex; align-items: center; overflow: hidden; padding: 0 11px; border: 1px solid var(--field-line); border-radius: 999px; background: var(--field); font-size: 13px; white-space: nowrap; }
    .ui .input .ph { color: var(--muted); }
    .ui .cbtn { min-height: 36px; display: inline-flex; align-items: center; padding: 5px 11px; border: 1px solid var(--field-line); border-radius: 999px; background: var(--field); font-size: 12px; white-space: nowrap; }
    .ui .options { display: grid; grid-template-columns: minmax(155px, .8fr) minmax(0, 2.5fr); gap: 10px; align-items: start; }
    .ui .full { grid-column: 1 / -1; }
    .ui .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--field); }
    .ui .tabs span { padding: 7px 4px; border-radius: 999px; color: var(--muted); text-align: center; font-size: 12px; line-height: 1.25; }
    .ui .tabs span.on { background: var(--surface); color: var(--ink); }
    .ui .seg { display: grid; gap: 5px; }
    .ui .seg6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .ui .seg3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .ui .seg > span { min-width: 0; min-height: 44px; display: flex; flex-direction: column; justify-content: center; padding: 5px 2px; border: 1px solid var(--line); border-radius: 14px; background: var(--field); text-align: center; font-size: 12px; line-height: 1.2; font-weight: 700; }
    .ui .seg small { margin-top: 2px; color: var(--muted); font-size: 10px; font-weight: 400; }
    .ui .seg > span.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .ui .seg > span.on small { color: var(--accent); }
    .ui .seg.out > span { min-height: 58px; align-items: flex-start; padding-inline: 10px; text-align: left; }
    .ui .seg.out strong { font-size: 12px; }
    .ui .seg.out small { font-size: 9px; }
    .ui .hint { margin-top: 5px; color: var(--muted); font-size: 10px; line-height: 1.35; }
    .ui .outgrid { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(230px, 1fr); gap: 12px; align-items: end; padding-top: 10px; border-top: 1px solid var(--line); }
    .ui .folder-row { display: flex; align-items: center; gap: 6px; }
    .ui .folder { min-width: 0; min-height: 36px; flex: 1; overflow: hidden; padding: 8px 10px; border: 1px solid var(--field-line); border-radius: 999px; background: var(--field); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .ui .enc { width: 100%; min-height: 42px; display: flex; align-items: center; gap: 10px; padding: 6px 11px; border: 1px solid var(--field-line); border-radius: 15px; background: var(--field); }
    .ui .enc-copy { min-width: 0; flex: 1; }
    .ui .enc-value { display: block; font-size: 12px; font-weight: 750; }
    .ui .enc-desc { display: block; margin-top: 1px; color: var(--muted); font-size: 10px; }
    .ui .chev { width: 8px; height: 8px; flex: none; margin: -4px 2px 0 0; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg); }
    .ui .final { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; }
    .ui .check { min-height: 34px; display: inline-flex; align-items: center; gap: 7px; font-size: 12px; }
    .ui .box { width: 15px; height: 15px; display: grid; place-items: center; border: 1.5px solid var(--muted); border-radius: 3px; }
    .ui .progress { grid-column: 1 / -1; grid-row: 2; padding: 8px 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--field); }
    .ui .phase { margin-bottom: 4px; overflow: hidden; font-size: 12px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .ui .bar { height: 5px; overflow: hidden; border-radius: 99px; background: var(--line); }
    .ui .fill { height: 100%; border-radius: inherit; background: var(--accent); }
    .ui .stats { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
    .ui .stats b { color: var(--ink); }
    .ui .primary { min-width: 150px; min-height: 38px; display: inline-flex; align-items: center; justify-content: center; padding: 8px 14px; border-radius: 999px; background: var(--action); color: var(--on-action); font-size: 13px; font-weight: 700; }
    .ui .result { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--field); }
    .ui .result > svg { width: 20px; height: 20px; flex: none; color: var(--ok); }
    .ui .rcopy { min-width: 0; flex: 1; }
    .ui .rtitle { font-size: 12px; font-weight: 750; }
    .ui .rdetail { color: var(--muted); font-size: 11px; }
    .ui .box.on { border-color: var(--accent); background: var(--accent); }
    .ui .box svg { width: 11px; height: 11px; }
    .ui .menu { display: grid; gap: 3px; padding: 5px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); }
    .ui .opt { min-height: 40px; display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid transparent; border-radius: 10px; }
    .ui .opt.on { border-color: var(--line); background: var(--accent-soft); }
    .ui .opt-check { width: 15px; flex: none; color: var(--accent); font-size: 13px; font-weight: 800; text-align: center; }
    .ui .opt-copy { min-width: 0; flex: 1; }
    .ui .opt-title { display: block; font-size: 11px; font-weight: 750; }
    .ui .opt-desc { display: block; margin-top: 2px; color: var(--muted); font-size: 9px; }
    .ui .badge { flex: none; padding: 3px 6px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 8px; font-weight: 800; letter-spacing: .04em; }
    .ui .opt.on .badge { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); color: var(--accent); }
    .ui .files { display: grid; gap: 6px; }
    .ui .file { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--field); font-size: 12px; font-weight: 700; }
    .ui .file small { margin-left: auto; color: var(--muted); font-weight: 400; }
    .ui.dark { --page: #1c1917; --surface: #2a211d; --field: #332921; --line: #493a30; --field-line: #66503e; --ink: #f4efe9; --muted: #c8b9ac; --accent: #f2a054; --accent-soft: #463526; --ok: #75c18d; }
  </style>
</head>
<body>
  <main id="stage" role="img" aria-label="FramePort">
    <div class="glow" id="glowA"></div>
    <div class="glow" id="glowB"></div>
    <div class="glow" id="glowC"></div>
    <div class="glow" id="glowD"></div>

    <!-- 1: ทุ่งการ์ดกระจกจากหน้าจอโปรแกรม + ประโยคเปิด -->
    <div class="scene" id="s1"><div id="tiles"></div><div class="typed center t-hero" id="t1"></div></div>
    <!-- 2: การ์ดโลโก้ -->
    <div class="scene" id="s2">
      <div class="float glass" id="logoCard"><div class="app-icon" id="logoIcon"></div><div class="wordmark" id="logoWord"></div></div>
      <div class="subline" id="logoSub"></div>
    </div>
    <!-- 3: ข้อความซ้าย + หน้าต่างโปรแกรมจริงด้านขวา (วางลิงก์ → 4K → ดาวน์โหลด) -->
    <div class="scene" id="s3">
      <div class="eyebrow" id="e3"></div>
      <div class="typed t-col bold" id="t3a"></div>
      <div class="typed t-col" id="t3b"></div>
      <div class="typed t-col" id="t3c"></div>
      <div class="win" id="win"></div>
    </div>
    <!-- 4: ความคืบหน้าขนาดใหญ่ -->
    <div class="scene" id="s4">
      <div class="typed center t-head" id="t4"></div>
      <div id="encPills"></div>
      <div class="float glass" id="bigProg"></div>
      <div class="float glass" id="bigResult"></div>
    </div>
    <!-- 5: การ์ดไฟล์ลอยรอบข้อความ -->
    <div class="scene" id="s5"><div id="fcards"></div><div class="typed center t-hero" id="t5"></div></div>
    <!-- 6: การ์ดฟีเจอร์ 8 ใบเอียงเป็นผืนครึ่งล่าง + หัวข้อด้านบน -->
    <div class="scene" id="s6">
      <div id="gridWrap"><div id="plane"></div></div>
      <div class="typed center t-head" id="t6"></div>

      [u.encoderLabel, `<div class="menu">${opt('NVIDIA · CUDA / NVENC', u.nvDesc, u.recommended, true)}${opt('Intel · Quick Sync', u.intelDesc, 'iGPU')}${opt('AMD · AMF', u.amdDesc, 'GPU')}</div>`],
      [u.namesCard, `<div class="files">${['Clip.mp4', 'Clip 2.mp4', 'Clip 3.mp4'].map((f) => `<div class="file">${f}<small>H.264</small></div>`).join('')}</div>`],
      [u.outputLabel, outSeg],
      [u.playlist, `<span class="check"><span class="box on">${tick}</span>${u.playlist}</span><div class="progress" style="margin-top:6px"><div class="phase">${u.downloading} · ${u.item}3/12</div><div class="bar"><div class="fill" style="width:42%"></div></div><div class="stats"><span><b>42.0%</b></span><span>42.80MiB/s</span><span>${T.remaining}00:06</span></div></div>`],
      [u.themeCard, `<div class="ui dark" style="padding:10px 12px 12px;border-radius:14px;background:var(--page)">${topbarMini}<span class="primary">${u.start}</span></div>`],
      [u.langCard, `<div class="tabs" style="margin-bottom:10px"><span class="on">ไทย</span><span>English</span></div><div class="headline">${COPY.th.ui.headline}</div><div class="headline" style="margin-top:6px;color:var(--muted)">${COPY.en.ui.headline}</div>`],
    ];
    $('plane').innerHTML = CARDS.map(([label, body], k) => `<div class="glass gcard" style="left:${(k % 4) * 600}px;top:${Math.floor(k / 4) * 370}px"><div class="ui"><div class="glabel">${label}</div>${body}</div></div>`).join('');

    $('t1').innerHTML = typedHtml(T.t1);
    $('logoIcon').innerHTML = icon();
    $('logoWord').innerHTML = '<span class="w">Frame</span><span class="w hot">Port</span>';
    $('logoSub').textContent = T.logoSub;
    $('e3').textContent = T.e3;
    ['t3a', 't3b', 't3c'].forEach((id, k) => { $(id).innerHTML = typedHtml(T.t3[k]); });
    $('t4').innerHTML = typedHtml(T.t4);
    $('t5').innerHTML = typedHtml(T.t5);
    $('t6').innerHTML = typedHtml(T.t6);
    $('s6sub').textContent = T.s6sub;
    $('endIcon').innerHTML = icon();
    $('endWord').innerHTML = $('logoWord').innerHTML;
    $('endLine').innerHTML = words(T.endLine);
    $('endNotes').innerHTML = words(T.endNotes);
    $('endUrl').innerHTML = `<span class="w">${SITE}</span>`;
    $('endBy').innerHTML = `<span class="lbl">${T.by}</span><span class="chip">${candyLogo}CandyCore</span>`;
    $('stage').setAttribute('aria-label', T.label);

    const all = (selector, root) => [...root.querySelectorAll(selector)];
    const ws = (id) => all('.w', $(id));
    const el = {
      stage: $('stage'), glows: ['glowA', 'glowB', 'glowC', 'glowD'].map($), fade: $('fade'), pointer: $('pointer'), clickRing: $('clickRing'),
      scenes: Object.fromEntries([1, 2, 3, 4, 5, 6, 7].map((k) => [k, $(`s${k}`)])),
      tiles: all('.tile', $('tiles')), t1: $('t1'),
      logoCard: $('logoCard'), logoArrow: $('logoIcon').querySelector('.arrow'), logoUnder: $('logoIcon').querySelector('.under'), logoWord: $('logoWord'), logoSub: $('logoSub'),
      e3: $('e3'), t3: ['t3a', 't3b', 't3c'].map($), win: $('win'),
      wIn: $('wIn'), wPaste: $('wPaste'), chips: all('.seg > span', $('wRes')), wGo: $('wGo'), wProg: $('wProg'), wPhase: $('wPhase'), wFill: $('wFill'), wPct: $('wPct'), wSpeed: $('wSpeed'), wEta: $('wEta'),
      t4: $('t4'), pills: all('.pill', $('encPills')), bigProg: $('bigProg'), bpPhase: $('bpPhase'), bpFill: $('bpFill'), bpPct: $('bpPct'), bpSpeed: $('bpSpeed'), bpEta: $('bpEta'), bigResult: $('bigResult'),
      fcards: all('.fcard', $('fcards')), edPill: $('edPill'), kPill: $('kPill'), t5: $('t5'),
      plane: $('plane'), gcards: all('.gcard', $('plane')), t6: $('t6'), s6sub: $('s6sub'),
      endGlow: $('endGlow'), endIcon: $('endIcon'), endArrow: $('endIcon').querySelector('.arrow'), endUnder: $('endIcon').querySelector('.under'), endWord: $('endWord'),
      endLine: ws('endLine'), endNotes: ws('endNotes'), endUrl: ws('endUrl'), byLabel: $('endBy').querySelector('.lbl'), byChip: $('endBy').querySelector('.chip'),
    };

    // ---------- เวลาและการเคลื่อนไหว ----------
    const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
    const lerp = (a, b, p) => a + (b - a) * p;
    const E = {
      lin: (p) => p,
      in: (p) => p ** 3,
      inOut: (p) => (p < .5 ? 4 * p ** 3 : 1 - (-2 * p + 2) ** 3 / 2),
      out4: (p) => 1 - (1 - p) ** 4,
      expo: (p) => (p >= 1 ? 1 : 1 - 2 ** (-10 * p)),
      back: (p) => 1 + 1.7 * (p - 1) ** 3 + .7 * (p - 1) ** 2, // เด้งเกินเล็กน้อย (~4%)
    };
    const ramp = (t, a, b, ease = E.inOut) => ease(clamp((t - a) / (b - a)));
    const bump = (t, c, d = .3) => Math.sin(Math.PI * clamp((t - c + d * .3) / d));
    const px = (v) => v.toFixed(2);
    const shown = new Map();
    const text = (node, value) => { if (shown.get(node) !== value) { shown.set(node, value); node.textContent = value; } };
    function show(node, opacity) {
      const visible = opacity > .002;
      node.style.visibility = visible ? '' : 'hidden';
      node.style.opacity = visible ? opacity.toFixed(3) : 0;
      return visible;
    }
    const blurCss = (amount) => (amount > .05 ? `blur(${px(amount)}px)` : 'none');
    function fx(node, a, o = {}) {
      const { blur = 12, rise = 24 } = o;
      if (!show(node, clamp(a))) return;
      node.style.filter = blurCss((1 - a) * blur);
      node.style.transform = `translateY(${px((1 - a) * rise)}px)`;
    }
    // คำค่อยๆ ลอยขึ้นและชัดขึ้นทีละคำ (ห่างกันคำละ step วินาที)
    function reveal(node, t, start, step = .14) {
      const ws = node._w || (node._w = all('.w', node));
      if (!show(node, t >= start - .05 ? 1 : 0)) return;
      ws.forEach((w, j) => fx(w, ramp(t, start + j * step, start + j * step + .7, E.expo), { rise: 26, blur: 12 }));
    }
    const put = (node, cx, cy, extra = '') => { node.style.transform = `translate(${px(cx)}px,${px(cy)}px) ${extra} translate(-50%,-50%)`; };
    const place = (node, size, cx, cy, s = 1) => { node.style.transform = `translate(${px(cx - size / 2)}px,${px(cy - size / 2)}px) scale(${s.toFixed(4)})`; };
    function centerOnStage(node) {
      const s = el.stage.getBoundingClientRect(), r = node.getBoundingClientRect(), k = s.width / 1920;
      return { x: (r.x + r.width / 2 - s.x) / k, y: (r.y + r.height / 2 - s.y) / k };
    }
    function iconMotion(arrow, under, drop, line) {
      arrow.setAttribute('transform', `translate(0 ${lerp(-330, 0, drop).toFixed(1)})`);
      const half = 55 * line;
      under.setAttribute('x1', (256 - half).toFixed(1));
      under.setAttribute('x2', (256 + half).toFixed(1));
      under.setAttribute('opacity', half > .5 ? 1 : 0);
    }
    function pointerPath(t, legs) {
      let pos = legs[0][2];
      for (const [a, b, from, to] of legs) {
        if (t < a) break;
        const p = ramp(t, a, b, E.inOut);
        pos = { x: lerp(from.x, to.x, p), y: lerp(from.y, to.y, p) - 40 * Math.sin(Math.PI * p) };
      }
      return pos;
    }
    // เลื่อนโฟกัสเข้า/ออกของแต่ละฉาก + กล้องดันเข้าช้าๆ ตลอดเวลาที่อยู่บนจอ
    function focus(k, t) {
      const [a, b] = SCENES[k];
      const i = ramp(t, a, a + .55, E.out4), o = ramp(t, b, b + .35, E.in);
      return { op: i * (1 - o), blur: (1 - i) * 16 + o * 18, s: lerp(.965, 1, i) * lerp(1, 1.05, o) * (1 + .03 * ramp(t, a, b + .35, E.lin)) };
    }
    const middle = (node, cy) => { node.style.top = `${px(cy - node.offsetHeight / 2)}px`; };
    let ready = false;
    function measure() {
      middle(el.t1, 540); middle(el.logoSub, 830);
      el.e3.style.left = el.t3[0].style.left = el.t3[1].style.left = el.t3[2].style.left = '150px';
      // ข้อความสามบรรทัดต้องอยู่หน้าหน้าต่างเสมอ: วัดบรรทัดที่ยาวที่สุด (แสดงครบทุกตัว) แล้วย่อฟอนต์ให้พอดีช่องซ้าย
      el.t3.forEach((line) => { line.style.fontSize = ''; });
      const widest = Math.max(...el.t3.map((line) => line.scrollWidth));
      const room = WIN_X - 60 - 940 * WIN_S / 2 - 70 - 150;
      if (widest > room) el.t3.forEach((line) => { line.style.fontSize = `${px(92 * room / widest)}px`; });
      middle(el.e3, 300); middle(el.t3[0], 420); middle(el.t3[1], 540); middle(el.t3[2], 660);
      middle(el.t4, 190); middle(el.t5, 540); middle(el.t6, 165); middle(el.s6sub, 258);
      [['endWord', 500], ['endLine', 612], ['endNotes', 702], ['endUrl', 760], ['endBy', 890]].forEach(([id, cy]) => middle($(id), cy));
      ready = true;
    }

    function render(t) {
      if (!ready) return;
      place(el.glows[0], 1500, 520 + 150 * Math.sin(t * .23), 260 + 90 * Math.cos(t * .2), 1 + .05 * Math.sin(t * .31));
      place(el.glows[1], 1300, 1500 + 120 * Math.cos(t * .19), 860 + 80 * Math.sin(t * .26));
      place(el.glows[2], 1400, 1560 + 90 * Math.sin(t * .17 + 1), 200 + 70 * Math.cos(t * .22));
      place(el.glows[3], 1200, 960 + 60 * Math.sin(t * .2), 540 + 40 * Math.cos(t * .23));
      el.fade.style.opacity = Math.max(1 - ramp(t, 0, .45), ramp(t, OUT, DURATION)).toFixed(3);
      const on = {};
      for (const k in SCENES) {
        const [a, b] = SCENES[k];
        on[k] = t > a - .05 && t < b + .36;
        const f = focus(k, t), scene = el.scenes[k];
        if (!show(scene, on[k] ? f.op : 0)) continue;
        scene.style.filter = blurCss(f.blur);
        scene.style.transform = `scale(${f.s.toFixed(4)})`;
      }
      let ptr = null, press = 0, ring = null;

      // 1: การ์ดกระจกลอยขึ้นทีละใบ (ระยะชัดตื้น) + พิมพ์ประโยคเปิด → การ์ดกระจายออกจากกลางจอ
      if (on[1]) {
        const spread = ramp(t, 2.6, 3.13, E.in);
        el.tiles.forEach((tile, i) => {
          const [, x, y, depth] = TILES[i];
          const e = ramp(t, .1 + i * .07, .75 + i * .07, E.out4);
          const s = 1.5 * (1 - .1 * depth) * lerp(.94, 1, e);
          const dx = (x - 960) * .5 * spread, dy = (y - 540) * .5 * spread;
          put(tile, x - 30 * ramp(t, 0, 3, E.lin) * (1 - depth * .3) + dx, y + 40 * (1 - e) + dy, `scale(${s.toFixed(4)})`);
          tile.style.filter = blurCss(depth * 2.6 + (1 - e) * 8);
          show(tile, e);
        });
        reveal(el.t1, t, .5);
      }

      // 2: การ์ดโลโก้กระจก · ลูกศรตกตรงจังหวะ 3.72 · พิมพ์ชื่อโปรแกรม
      if (on[2]) {
        put(el.logoCard, 960, 520, `scale(${lerp(.94, 1, ramp(t, 3.06, 3.7, E.out4)).toFixed(4)})`);
        iconMotion(el.logoArrow, el.logoUnder, ramp(t, 3.5, 4.0, E.back), ramp(t, 3.72, 3.98, E.expo));
        reveal(el.logoWord, t, 3.85);
        fx(el.logoSub, ramp(t, 4.3, 4.8, E.expo));
      }

      // 3: "ง่ายใน 3 ขั้น" + พิมพ์ทีละบรรทัดคู่กับการกดในหน้าต่างจริง (วางลิงก์ 5.9 · 4K 6.95 · ดาวน์โหลด 7.9)
      if (on[3]) {
        const d = ramp(t, 5.28, 8.75, E.lin);
        put(el.win, WIN_X - 60 * d, 560, `perspective(2200px) rotateY(${px(-15 + 6 * d)}deg) rotateX(${px(4 - 2 * d)}deg) scale(${WIN_S})`);
        fx(el.e3, ramp(t, 5.35, 5.8, E.expo));
        reveal(el.t3[0], t, 5.5);
        reveal(el.t3[1], t, 6.55);
        reveal(el.t3[2], t, 7.5);
        el.t3.forEach((line, k) => { if (line.style.visibility !== 'hidden') line.style.opacity = lerp(1, .42, k < 2 ? ramp(t, [6.55, 7.5][k], [6.55, 7.5][k] + .4) : 0).toFixed(3); });
        const pasted = t >= CLICKS[0] + .02;
        if (shown.get(el.wIn) !== pasted) { shown.set(el.wIn, pasted); el.wIn.innerHTML = pasted ? URL_TEXT : `<span class="ph">${u.placeholder}</span>`; }
        const flash = pasted ? 1 - ramp(t, CLICKS[0] + .1, CLICKS[0] + 1.1) : 0;
        el.wIn.style.borderColor = pasted ? 'var(--accent)' : '';
        el.wIn.style.boxShadow = pasted ? `0 0 0 ${px(2 + 4 * flash)}px color-mix(in srgb, var(--accent) ${Math.round(16 + 22 * flash)}%, transparent)` : '';
        const fourK = t >= CLICKS[1] + .02;
        el.chips[0].classList.toggle('on', !fourK);
        el.chips[1].classList.toggle('on', fourK);
        el.chips[1].style.transform = `scale(${(1 + .1 * bump(t, CLICKS[1] + .05, .35)).toFixed(4)})`;
        const dl = CLICKS[2] + .05;
        text(el.wGo, t >= dl ? u.working : u.start);
        show(el.wProg, ramp(t, dl, dl + .15));
        const pct = ramp(t, dl + .05, 8.75, E.lin) * .58;
        text(el.wPhase, u.downloading);
        el.wFill.style.transform = `scaleX(${pct.toFixed(4)})`;
        el.wFill.style.transformOrigin = 'left';
        text(el.wPct, `${(pct * 100).toFixed(1)}%`);
        text(el.wSpeed, '42.80MiB/s');
        text(el.wEta, `${T.remaining}00:0${Math.max(1, Math.ceil((1 - pct) * 4))}`);
        [el.wPaste, el.wGo].forEach((node, k) => { node.style.transform = `scale(${(1 - .07 * bump(t, [CLICKS[0], CLICKS[2]][k], .24)).toFixed(4)})`; });
        if (t > 5.4 && t < 8.35) {
          const targets = [centerOnStage(el.wPaste), centerOnStage(el.chips[1]), centerOnStage(el.wGo)];
          const at = pointerPath(t, [[5.45, 5.8, { x: 1500, y: 980 }, targets[0]], [6.45, 6.85, targets[0], targets[1]], [7.4, 7.8, targets[1], targets[2]]]);
          ptr = { at, o: ramp(t, 5.4, 5.55) * (1 - ramp(t, 8.1, 8.3)) };
          press = CLICKS.reduce((v, c) => Math.max(v, bump(t, c, .22)), 0);
          const last = CLICKS.filter((c) => c <= t).pop();
          if (last !== undefined) ring = { at: targets[CLICKS.indexOf(last)], t: last };
        }
      }

      // 4: "แปลงไฟล์ด้วยการ์ดจอ" + แผงความคืบหน้าขนาดใหญ่ → บันทึกไฟล์แล้ว
      if (on[4]) {
        reveal(el.t4, t, 8.8);
        el.pills.forEach((pill, k) => {
          const a = ramp(t, 9.05 + k * .1, 9.5 + k * .1, E.expo);
          put(pill, 960 + (k - 1) * 420, 345 + 16 * (1 - a));
          pill.style.filter = blurCss((1 - a) * 10);
          show(pill, a);
        });
        put(el.bigProg, 960, 590, '');
        const done = t >= 10.02;
        const pct = done ? 1 : ramp(t, 8.72, 10.0, E.inOut);
        text(el.bpPhase, done ? u.finished : T.converting);
        el.bpFill.style.transform = `scaleX(${pct.toFixed(4)})`;
        text(el.bpPct, `${(pct * 100).toFixed(1)}%`);
        text(el.bpSpeed, done ? '' : '6.1×');
        text(el.bpEta, done ? '' : `${T.remaining}00:0${Math.max(1, Math.ceil((1 - pct) * 3))}`);
        const r = ramp(t, 10.05, 10.4, E.out4);
        put(el.bigResult, 960, 830 + 30 * (1 - r), '');
        el.bigResult.style.filter = blurCss((1 - r) * 8);
        show(el.bigResult, r);
      }

      // 5: การ์ดไฟล์ลอยรอบข้อความ (ชิ้นไกลเบลอ) ค่อยๆ ลอยออกจากกลางจอ
      if (on[5]) {
        reveal(el.t5, t, 11.0);
        const drift = ramp(t, 10.88, 13.3, E.lin);
        const items = [...el.fcards.map((n, i) => [n, ...FCARDS[i].slice(1)]), [el.edPill, 960, 740, 1], [el.kPill, 960, 290, 2]];
        items.forEach(([node, x, y, depth], i) => {
          const e = ramp(t, 10.95 + i * .08, 11.55 + i * .08, E.out4);
          const s = (1.05 - .14 * depth) * lerp(.9, 1, e);
          put(node, x + (x - 960) * .06 * drift, y + (y - 540) * .06 * drift + 30 * (1 - e), `scale(${s.toFixed(4)})`);
          node.style.filter = blurCss(depth * 3 + (1 - e) * 10);
          show(node, e * (1 - .15 * depth));
        });
      }

      // 6: การ์ดฟีเจอร์ 8 ใบเอียงเป็นผืนครึ่งล่าง ลอยขึ้นทีละใบ กล้องเลื่อนผ่านช้าๆ + "ครบในหน้าจอเดียว" ด้านบนบนพื้นเรียบ
      if (on[6]) {
        const e = ramp(t, 13.28, 13.95, E.out4), d = ramp(t, 13.28, 15.5, E.lin);
        el.plane.style.transform = `translate(${960 - 1180}px,${680 - 350}px) perspective(1800px) rotateX(${px(lerp(56, 44, e))}deg) rotateZ(-12deg) translateX(${px(lerp(300, -300, d))}px) scale(${lerp(.92, 1, e).toFixed(4)})`;
        el.gcards.forEach((card, k) => {
          const a = ramp(t, 13.32 + k * .05, 13.85 + k * .05, E.out4);
          show(card, a);
          card.style.transform = `translateY(${px((1 - a) * 80)}px)`;
        });
        reveal(el.t6, t, 13.45);
        fx(el.s6sub, ramp(t, 13.85, 14.35, E.expo), { rise: 14 });
      }

      // 7: ปิดท้าย · ไอคอนเด้ง → เพลงกลับมา (15.74) ลูกศรตก → พิมพ์ชื่อ FramePort → รายละเอียด → ค้างให้อ่าน
      if (on[7]) {
        const ip = ramp(t, 15.38, 15.8, E.back);
        show(el.endIcon, ip > .01 ? 1 : 0);
        place(el.endIcon, 190, 960, 285, ip);
        show(el.endGlow, ramp(t, 15.4, 15.9) * (.7 + .3 * bump(t, HIT + .1, .9)));
        place(el.endGlow, 760, 960, 285, 1 + .08 * bump(t, HIT + .1, .9));
        iconMotion(el.endArrow, el.endUnder, ramp(t, 15.5, 16.05, E.back), ramp(t, HIT, HIT + .28, E.expo));
        reveal(el.endWord, t, 15.9);
        el.endLine.forEach((n, j) => fx(n, ramp(t, 16.45 + j * .06, 16.95 + j * .06, E.expo)));
        el.endNotes.forEach((n, j) => fx(n, ramp(t, 16.65 + j * .05, 17.15 + j * .05, E.expo), { rise: 18, blur: 10 }));
        el.endUrl.forEach((n) => fx(n, ramp(t, 16.82, 17.3, E.expo), { rise: 18, blur: 10 }));
        fx(el.byLabel, ramp(t, 16.98, 17.5, E.expo), { rise: 16, blur: 10 });
        fx(el.byChip, ramp(t, 17.05, 17.55, E.expo), { rise: 16, blur: 10 });
      }

      if (show(el.pointer, ptr ? ptr.o : 0)) el.pointer.style.transform = `translate(${px(ptr.at.x)}px,${px(ptr.at.y)}px) scale(${(1 - .16 * press).toFixed(3)})`;
      const rp = ring ? (t - ring.t) / .5 : 1;
      if (show(el.clickRing, rp < 1 ? (1 - rp) * .9 : 0)) el.clickRing.style.transform = `translate(${px(ring.at.x)}px,${px(ring.at.y)}px) scale(${lerp(.3, 2.2, E.expo(rp)).toFixed(3)})`;
    }
    // ---------- เล่นดูในเบราว์เซอร์ (?t=วินาที&paused&lang=en) หรือให้ promo/render.js คุมทีละเฟรม (?render) ----------
    const rendering = params.has('render');
    let playhead = clamp(Number(params.get('t')) || 0, 0, DURATION);
    let last = 0;
    const draw = () => render(playhead);
    function loop(frame) {
      const dt = last ? Math.min(.25, (frame - last) / 1000) : 0;
      last = frame;
      if (!params.has('paused')) playhead = (playhead + dt) % DURATION;
      draw();
      requestAnimationFrame(loop);
    }
    const fit = () => el.stage.style.setProperty('--fit', Math.min(innerWidth / 1920, innerHeight / 1080));
    addEventListener('resize', fit);
    fit();
    const relayout = () => { measure(); draw(); };
    document.fonts?.addEventListener('loadingdone', relayout);
    // โหลดฟอนต์ทุกน้ำหนักและทุกตัวอักษรที่ใช้ก่อนเริ่ม ทุกเฟรมจึงใช้ฟอนต์เดียวกัน
    const sample = [JSON.stringify(COPY), URL_TEXT, FILE, FOLDER, SITE, 'CandyCore', '0123456789 %×·…✓/'].join(' ');
    const fontsReady = Promise.all(['400', '500', '600', '700'].flatMap((weight) =>
      ['IBM Plex Sans Thai', 'IBM Plex Sans', 'Urbanist'].map((family) => document.fonts.load(`${weight} 40px "${family}"`, sample))))
      .catch(() => {})
      .then(() => document.fonts.ready)
      .then(relayout);
    if (!rendering) fontsReady.then(() => requestAnimationFrame(loop));

    // สเปกคลิปสำหรับ promo/render.js: 24fps, motion blur ทุกเฟรม = เฟรมย่อย 16 เฟรมภายในชัตเตอร์ 360° (เบลอยาวต่อเนื่องเต็มช่วงเฟรม)
    window.FramePortClip = {
      duration: DURATION, fps: 24, samples: 16, shutter: 1,
      ready: () => fontsReady.then(() => DURATION),
      renderAt: (v) => {
        playhead = v;
        draw();
        return new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(() => resolve(true))));
      },
    };
  </script>
</body>
</html>
